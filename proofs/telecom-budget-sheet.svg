<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">PDF EXPLICATIF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Fiche PDF · Budget de</tspan><tspan x="60" dy="53">liaison</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Support simulé pour expliquer une méthode de calcul</tspan><tspan x="60" dy="36">reproductible dans un contexte télécom.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">télécom</text><rect x="242" y="272" width="232" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">budget de liaison</text><rect x="486" y="272" width="170" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="508" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">hypothèses</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Les calculs de liaison deviennent</tspan><tspan x="88" dy="26">peu fiables lorsqu'ils sont</tspan><tspan x="88" dy="26">dispersés ou mal documentés.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Poser les hypothèses, garder la</tspan><tspan x="518" dy="26">formule visible et comparer</tspan><tspan x="518" dy="26">plusieurs scénarios.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une fiche réutilisable pour</tspan><tspan x="948" dy="26">refaire le calcul proprement.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Support de calcul simulé</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Le document explicite ce qui entre dans le calcul et montre comment la décision finale dépend des</tspan><tspan x="88" dy="26">hypothèses retenues.</tspan></text><rect x="94" y="628" width="520" height="220" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="122" y="662" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="122" dy="0">Chaîne de calcul</tspan></text><text x="122" y="712" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500"><tspan x="122" dy="0">Ptx + Gtx + Grx - pertes câble - pertes</tspan><tspan x="122" dy="29">espace libre - marge = puissance reçue</tspan><tspan x="122" dy="29">estimée</tspan></text><rect x="660" y="628" width="150" height="52" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="676" y="660" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">Paramètre</text><rect x="820" y="628" width="180" height="52" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="836" y="660" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">Exemple</text><rect x="1010" y="628" width="260" height="52" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="1026" y="660" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">Rôle</text><rect x=