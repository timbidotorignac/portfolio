<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">PDF EXPLICATIF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Fiche PDF · Notes</tspan><tspan x="60" dy="53">d'apprentissage SQLi</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Support simulé pour transformer des notes éparses en</tspan><tspan x="60" dy="36">matière de révision claire et défensive.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Burp Suite</text><rect x="242" y="272" width="170" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">notes</text><rect x="424" y="272" width="170" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="446" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">restitution</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Des observations dispersées</tspan><tspan x="88" dy="26">restent peu utiles si elles ne</tspan><tspan x="88" dy="26">sont pas reclassées par logique.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Relier symptômes, cause technique</tspan><tspan x="518" dy="26">et remédiation dans une seule</tspan><tspan x="518" dy="26">fiche.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une feuille de révision</tspan><tspan x="948" dy="26">structurée.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Fiche de révision simulée</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Le document organise la note autour d'une question simple: que regarder, quoi comprendre et quelle</tspan><tspan x="88" dy="26">correction retenir ensuite.</tspan></text><rect x="110" y="640" width="240" height="170" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="138" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="138" dy="0">Observation</tspan></text><text x="138" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="138" dy="0">Paramètre sensible ou</tspan><tspan x="138" dy="23">comportement inhabituel</tspan><tspan x="138" dy="23">repéré en environnement</tspan><tspan x="138" dy="23">d'essai.</tspan></text><line x1="350" y1="724" x2="371" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="371,724 355,715 355,733" fill="#72f5d6"/><rect x="395" y="640" width="240" height="170" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="423" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="423" dy="0">Lecture</tspan></text><text x="423" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="423" dy="0">Comprendre le lien entre</tspan><tspan x="423" dy="23">requête, traitement et</tspan><tspan x="423" dy="23">réponse renvoyée.</tspan></text><line x1="635" y1="724" x2="656" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="656,724 640,715 640,733" fill="#72f5d6"/><rect x="680" y="640" width="240" height="170" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="708" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="708" dy="0">Remédiation</tspan></text><text x="708" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="708" dy="0">Documenter la bonne</tspan><tspan x="708" dy="23">pratique à appliquer</tspan><tspan x="708" dy="23">côté code ou</tspan><tspan x="708" dy="23">configuration.</tspan></text><line x1="920" y1="724" x2="941" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="941,724 925,715 925,733" fill="#72f5d6"/><rect x="965" y="640" width="240" height="170" rx="28" fill="rgba(108,249,160,0.08)" stroke="#2f7051" stroke-width="2"/><text x="993" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="993" dy="0">Capitalisation</tspan></text><text x="993" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="993" dy="0">Conserver une fiche</tspan><tspan x="993" dy="23">claire pour révision ou</tspan><tspan x="993" dy="23">futur projet.</tspan></text><rect x="1080" y="560" width="220" height="240" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="1108" y="594" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1108" dy="0">Points à vérifier</tspan></text><text x="1108" y="639" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1108" dy="0">• Entrées ou signaux</tspan><tspan x="1108" dy="24">identifiés • Règle ou</tspan><tspan x="1108" dy="24">logique claire •</tspan><tspan x="1108" dy="24">Résultat exploitable •</tspan><tspan x="1108" dy="24">Support de restitution</tspan><tspan x="1108" dy="24">lisible</tspan></text></svg>