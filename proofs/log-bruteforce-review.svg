<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">PDF EXPLICATIF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Fiche PDF · Détection de</tspan><tspan x="60" dy="53">brute force</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Restitution simulée pour montrer le passage du log</tspan><tspan x="60" dy="36">brut à une lecture orientée détection et</tspan><tspan x="60" dy="36">investigation.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">logs</text><rect x="242" y="272" width="170" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">détection</text><rect x="424" y="272" width="184" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="446" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">investigation</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Des échecs répétés restent peu</tspan><tspan x="88" dy="26">lisibles sans seuil simple ni</tspan><tspan x="88" dy="26">regroupement temporel.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Repérer les répétitions par IP ou</tspan><tspan x="518" dy="26">compte puis formuler une alerte</tspan><tspan x="518" dy="26">exploitable.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une chronologie courte avec les</tspan><tspan x="948" dy="26">critères de détection.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(255,210,107,0.08)" stroke="#7a6332" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Chronologie simulée</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Le document illustre la logique retenue: transformer des événements dispersés en un signal défensif</tspan><tspan x="88" dy="26">compréhensible.</tspan></text><line x1="228" y1="650" x2="228" y2="860" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><circle cx="228" cy="670" r="11" fill="#72f5d6"/><rect x="278" y="638" width="530" height="90" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="306" y="672" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700"><tspan x="306" dy="0">08:14 · 8 échecs depuis</tspan><tspan x="306" dy="25">203.0.113.24</tspan></text><text x="306" y="715" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="306" dy="0">Même source, mêmes comptes cibles, fenêtre</tspan><tspan x="306" dy="23">de temps courte.</tspan></text><circle cx="228" cy="735" r="11" fill="#72f5d6"/><rect x="278" y="703" width="530" height="90" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="306" y="737" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700"><tspan x="306" dy="0">08:16 · seuil dépassé</tspan></text><text x="306" y="780" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="306" dy="0">Le script isole le motif et prépare une</tspan><tspan x="306" dy="23">alerte de premier niveau.</tspan></text><circle cx="228" cy="800" r="11" fill="#72f5d6"/><rect x="278" y="768" width="530" height="90" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="306" y="802" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700"><tspan x="306" dy="0">08:17 · lecture analyste</tspan></text><text x="306" y="845" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="306" dy="0">Regarder le compte visé, la persistance et</tspan><tspan x="306" dy="23">les journaux associés.</tspan></text><rect x="860" y="640" width="420" height="190" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="888" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="888" dy="0">Logique de détection</tspan></text><text x="888" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="888" dy="0">• regrouper les échecs sur une</tspan><tspan x="888" dy="24">fenêtre courte • mesurer la</tspan><tspan x="888" dy="24">répétition par IP ou compte •</tspan><tspan x="888" dy="24">isoler un seuil simple avant alerte</tspan><tspan x="888" dy="24">• préparer des éléments de</tspan><tspan x="888" dy="24">relecture</tspan></text></svg>