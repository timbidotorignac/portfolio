<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">PDF EXPLICATIF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Fiche PDF · Audit des</tspan><tspan x="60" dy="53">en-têtes HTTP</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Synthèse simulée pour rendre un inventaire d'en-têtes</tspan><tspan x="60" dy="36">plus lisible qu'une simple sortie console.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">HTTP</text><rect x="242" y="272" width="172" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">durcissement</text><rect x="426" y="272" width="170" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="448" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">inventaire</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Les oublis sur les en-têtes de</tspan><tspan x="88" dy="26">sécurité sont fréquents lorsque le</tspan><tspan x="88" dy="26">contrôle reste manuel.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Construire une lecture courte:</tspan><tspan x="518" dy="26">présent, absent, à vérifier, puis</tspan><tspan x="518" dy="26">relier le constat à une action.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une grille simple pour prioriser</tspan><tspan x="948" dy="26">le durcissement.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Grille de lecture simulée</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Chaque ligne matérialise la manière dont un script de contrôle peut produire une restitution claire pour</tspan><tspan x="88" dy="26">un site ou un service web.</tspan></text><rect x="94" y="632" width="250" height="54" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="112" y="666" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">En-tête</text><rect x="356" y="632" width="360" height="54" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="374" y="666" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Rôle</text><rect x="728" y="632" width="220" height="54" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="746" y="666" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Statut</text><rect x="960" y="632" width="390" height="54" rx="16" fill="rgba(255,255,255,0.05)" stroke="#1f3858"/><text x="978" y="666" fill="#e6f0ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">Action</text><rect x="94" y="702" width="250" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="112" y="732" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="112" dy="0">Strict-Transport-Security</tspan></text><rect x="356" y="702" width="360" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="374" y="732" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="374" dy="0">Forcer l'usage du HTTPS sur</tspan><tspan x="374" dy="24">la durée</tspan></text><rect x="728" y="702" width="220" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="746" y="732" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="746" dy="0">Conforme</tspan></text><rect x="960" y="702" width="390" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="978" y="732" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="978" dy="0">Conserver et vérifier la durée</tspan></text><rect x="94" y="790" width="250" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="112" y="820" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="112" dy="0">Content-Security-Policy</tspan></text><rect x="356" y="790" width="360" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="374" y="820" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="374" dy="0">Limiter les sources</tspan><tspan x="374" dy="24">autorisées côté navigateur</tspan></text><rect x="728" y="790" width="220" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="746" y="820" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="746" dy="0">À renforcer</tspan></text><rect x="960" y="790" width="390" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="978" y="820" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="978" dy="0">Définir une politique adaptée</tspan><tspan x="978" dy="24">aux scripts</tspan></text><rect x="94" y="878" width="250" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="112" y="908" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="112" dy="0">X-Frame-Options</tspan></text><rect x="356" y="878" width="360" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="374" y="908" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="374" dy="0">Réduire le risque de</tspan><tspan x="374" dy="24">clickjacking</tspan></text><rect x="728" y="878" width="220" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="746" y="908" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="746" dy="0">Conforme</tspan></text><rect x="960" y="878" width="390" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="978" y="908" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="978" dy="0">Documenter la valeur retenue</tspan></text><rect x="94" y="966" width="250" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="112" y="996" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="112" dy="0">Referrer-Policy</tspan></text><rect x="356" y="966" width="360" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="374" y="996" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600"><tspan x="374" dy="0">Limiter la fuite</tspan><tspan x="374" dy="24">d'informations</tspan></text><rect x="728" y="966" width="220" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="746" y="996" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="746" dy="0">À corriger vite</tspan></text><rect x="960" y="966" width="390" height="74" rx="18" fill="rgba(255,255,255,0.03)" stroke="#1f3858"/><text x="978" y="996" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="978" dy="0">Choisir une politique plus</tspan><tspan x="978" dy="24">restrictive</tspan></text><rect x="1010" y="560" width="290" height="250" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="1038" y="594" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1038" dy="0">Lecture attendue</tspan></text><text x="1038" y="639" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1038" dy="0">Le support met en avant</tspan><tspan x="1038" dy="24">la décision, pas</tspan><tspan x="1038" dy="24">seulement le constat</tspan><tspan x="1038" dy="24">technique.</tspan></text></svg>