<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">PDF EXPLICATIF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Fiche PDF · Prévenir</tspan><tspan x="60" dy="53">l'injection SQL</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Support explicatif simulé pour montrer une logique</tspan><tspan x="60" dy="36">défensive, lisible et réutilisable côté développement</tspan><tspan x="60" dy="36">web.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">SQL</text><rect x="242" y="272" width="170" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">validation</text><rect x="424" y="272" width="268" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="446" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">requêtes paramétrées</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Un formulaire mal protégé peut</tspan><tspan x="88" dy="26">faire dériver la requête SQL et</tspan><tspan x="88" dy="26">fragiliser tout le traitement.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Filtrer les entrées, séparer les</tspan><tspan x="518" dy="26">responsabilités et supprimer la</tspan><tspan x="518" dy="26">concaténation dangereuse.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une mini-fiche qui oppose un flux</tspan><tspan x="948" dy="26">fragile à un flux corrigé.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Lecture du support</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Le document synthétise ce qui doit être vérifié dans un traitement applicatif avant de considérer la</tspan><tspan x="88" dy="26">requête comme robuste.</tspan></text><rect x="110" y="640" width="240" height="170" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="138" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="138" dy="0">Entrée utilisateur</tspan></text><text x="138" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="138" dy="0">Contrôler le format, la</tspan><tspan x="138" dy="23">longueur et le type</tspan><tspan x="138" dy="23">attendu.</tspan></text><line x1="350" y1="724" x2="371" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="371,724 355,715 355,733" fill="#72f5d6"/><rect x="395" y="640" width="240" height="170" rx="28" fill="rgba(255,210,107,0.08)" stroke="#7a6332" stroke-width="2"/><text x="423" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="423" dy="0">Validation serveur</tspan></text><text x="423" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="423" dy="0">Refuser les cas hors</tspan><tspan x="423" dy="23">périmètre et journaliser</tspan><tspan x="423" dy="23">proprement.</tspan></text><line x1="635" y1="724" x2="656" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="656,724 640,715 640,733" fill="#72f5d6"/><rect x="680" y="640" width="240" height="170" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="708" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="708" dy="0">Requête paramétrée</tspan></text><text x="708" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="708" dy="0">Passer les données à la</tspan><tspan x="708" dy="23">base sans concaténation</tspan><tspan x="708" dy="23">risquée.</tspan></text><line x1="920" y1="724" x2="941" y2="724" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="941,724 925,715 925,733" fill="#72f5d6"/><rect x="965" y="640" width="240" height="170" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="993" y="674" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><tspan x="993" dy="0">Réponse</tspan><tspan x="993" dy="29">applicative</tspan></text><text x="993" y="721" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="993" dy="0">Renvoyer un résultat</tspan><tspan x="993" dy="23">clair sans exposer la</tspan><tspan x="993" dy="23">structure interne.</tspan></text><rect x="1080" y="560" width="220" height="240" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="1108" y="594" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1108" dy="0">Points à vérifier</tspan></text><text x="1108" y="639" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500"><tspan x="1108" dy="0">• Entrées ou signaux</tspan><tspan x="1108" dy="24">identifiés • Règle ou</tspan><tspan x="1108" dy="24">logique claire •</tspan><tspan x="1108" dy="24">Résultat exploitable •</tspan><tspan x="1108" dy="24">Support de restitution</tspan><tspan x="1108" dy="24">lisible</tspan></text></svg>