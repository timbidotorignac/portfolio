<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#09172a"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#72f5d6" stop-opacity="0.22"/><stop offset="100%" stop-color="#ff8ad1" stop-opacity="0.16"/></linearGradient></defs><rect width="1400" height="1000" rx="40" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="952" rx="34" fill="none" stroke="#1f3858" stroke-width="2"/><path d="M0 140 H1400" stroke="#1f3858" stroke-width="2"/><rect x="48" y="48" width="180" height="34" rx="17" fill="rgba(114,245,214,0.12)" stroke="rgba(114,245,214,0.32)"/><text x="72" y="70" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600">SCHEMA PDF</text><text x="1180" y="72" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Portfolio / preuve projet</text><text x="60" y="120" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800"><tspan x="60" dy="0">Schéma PDF ·</tspan><tspan x="60" dy="53">Segmentation réseau</tspan></text><text x="60" y="211" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500"><tspan x="60" dy="0">Schéma simulé pour montrer comment une checklist de</tspan><tspan x="60" dy="36">segmentation peut structurer les zones et les flux.</tspan></text><rect x="60" y="272" width="170" height="44" rx="22" fill="rgba(114,245,214,0.1)" stroke="#72f5d6" stroke-opacity="0.35"/><text x="82" y="300" fill="#72f5d6" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">réseau</text><rect x="242" y="272" width="170" height="44" rx="22" fill="rgba(109,168,255,0.12)" stroke="#6da8ff" stroke-opacity="0.35"/><text x="264" y="300" fill="#6da8ff" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">zones</text><rect x="424" y="272" width="196" height="44" rx="22" fill="rgba(255,138,209,0.12)" stroke="#ff8ad1" stroke-opacity="0.35"/><text x="446" y="300" fill="#ff8ad1" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600">flux autorisés</text><rect x="60" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="88" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="88" dy="0">Contexte</tspan></text><text x="88" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">La segmentation perd en efficacité</tspan><tspan x="88" dy="26">lorsque les zones et les flux</tspan><tspan x="88" dy="26">restent implicites.</tspan></text><rect x="490" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="518" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="518" dy="0">Réponse</tspan></text><text x="518" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="518" dy="0">Relier chaque zone à un usage et</tspan><tspan x="518" dy="26">documenter précisément les flux</tspan><tspan x="518" dy="26">autorisés.</tspan></text><rect x="920" y="338" width="410" height="148" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="948" y="372" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="948" dy="0">Livrable</tspan></text><text x="948" y="417" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="948" dy="0">Une carte simple des zones et des</tspan><tspan x="948" dy="26">contrôles.</tspan></text><text x="60" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">Tim Bidot-Orignac · document simulé cohérent avec le projet réel</text><text x="1100" y="954" fill="#9eb6cf" font-family="JetBrains Mono, monospace" font-size="16">version portfolio</text><rect x="60" y="540" width="1280" height="360" rx="28" fill="rgba(109,168,255,0.08)" stroke="#305f9a" stroke-width="2"/><text x="88" y="574" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700"><tspan x="88" dy="0">Carte de flux simulée</tspan></text><text x="88" y="624" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500"><tspan x="88" dy="0">Le support synthétise une logique simple: séparer, justifier, filtrer puis documenter les exceptions.</tspan></text><rect x="112" y="650" width="250" height="150" rx="28" fill="rgba(255,255,255,0.03)" stroke="#1f3858" stroke-width="2"/><text x="140" y="684" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="140" dy="0">Postes</tspan><tspan x="140" dy="27">utilisateurs</tspan></text><text x="140" y="729" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="140" dy="0">Flux bureautiques,</tspan><tspan x="140" dy="21">navigation, services</tspan><tspan x="140" dy="21">métiers</tspan></text><rect x="432" y="610" width="250" height="150" rx="28" fill="rgba(114,245,214,0.08)" stroke="#2c6f6c" stroke-width="2"/><text x="460" y="644" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="460" dy="0">Serveurs internes</tspan></text><text x="460" y="689" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="460" dy="0">Applications, base de</tspan><tspan x="460" dy="21">données, services</tspan><tspan x="460" dy="21">partagés</tspan></text><rect x="752" y="650" width="250" height="150" rx="28" fill="rgba(255,210,107,0.08)" stroke="#7a6332" stroke-width="2"/><text x="780" y="684" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="780" dy="0">Administration</tspan></text><text x="780" y="729" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="780" dy="0">Accès restreints,</tspan><tspan x="780" dy="21">supervision, sauts</tspan><tspan x="780" dy="21">contrôlés</tspan></text><rect x="1072" y="610" width="190" height="150" rx="28" fill="rgba(255,127,159,0.08)" stroke="#7b4560" stroke-width="2"/><text x="1100" y="644" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700"><tspan x="1100" dy="0">DMZ</tspan></text><text x="1100" y="689" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500"><tspan x="1100" dy="0">Services exposés et</tspan><tspan x="1100" dy="21">points d'échange filtrés</tspan></text><line x1="362" y1="724" x2="408" y2="684" stroke="#72f5d6" stroke-width="4" stroke-linecap="round"/><polygon points="408,684 392,675 392,693" fill="#72f5d6"/><line x1="682" y1="684" x2="728" y2="724" stroke="#6da8ff" stroke-width="4" stroke-linecap="round"/><polygon points="728,724 712,715 712,733" fill="#6da8ff"/><line x1="1002" y1="724" x2="1048" y2="684" stroke="#ff8ad1" stroke-width="4" stroke-linecap="round"/><polygon points="1048,684 1032,675 1032,693" fill="#ff8ad1"/><rect x="980" y="812" width="280" height="72" rx="28" fill="rgba(108,249,160,0.08)" stroke="#2f7051" stroke-width="2"/><text x="1008" y="846" fill="#e6f0ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="1008" dy="0">Règle directrice</tspan></text><text x="1008" y="888" fill="#9eb6cf" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500"><tspan x="1008" dy="0">Documenter les flux</tspan><tspan x="1008" dy="23">autorisés et couper les</tspan><tspan x="1008" dy="23">liaisons implicites.</tspan></text></svg>